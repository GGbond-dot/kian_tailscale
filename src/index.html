<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kian Remote Lab</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img class="brand-icon" src="./assets/app-icon.png" alt="" />
          <div>
            <p class="eyebrow">MULTI-NODE CONTROL PLANE</p>
            <h1>Kian Remote Lab</h1>
          </div>
        </div>
        <div class="header-actions">
          <button id="new-terminal" class="secondary" type="button" title="New terminal (Ctrl+Shift+T)">
            <span aria-hidden="true">+</span> New Terminal
          </button>
          <button id="refresh" class="icon-button" type="button" aria-label="Refresh status" title="Refresh status (Ctrl+Shift+R)">
            <span aria-hidden="true">&#8635;</span>
          </button>
        </div>
      </header>

      <div class="workspace-layout">
        <section class="terminal-shell" aria-label="SSH Terminal">
          <div class="terminal-bar">
            <div id="terminal-tabs" class="terminal-tabs" role="tablist" aria-label="SSH terminals"></div>
            <span id="terminal-target" class="terminal-target">DISCONNECTED</span>
          </div>
          <div id="terminal-stack" class="terminal-stack"></div>
        </section>

        <aside class="status-panel" aria-label="Connection overview">
          <div class="node-switcher" role="tablist" aria-label="Remote nodes">
            <button class="node-option active" type="button" role="tab" data-device-id="dk2500" aria-selected="true">
              <span id="node-dk2500-dot" class="dot" data-state="loading"></span>
              <span><strong>DK2500</strong><small>LINUX SERVER</small></span>
            </button>
            <button class="node-option" type="button" role="tab" data-device-id="desktop-5060" aria-selected="false">
              <span id="node-desktop-5060-dot" class="dot" data-state="loading"></span>
              <span><strong>Desktop 5060</strong><small>GPU / WSL2</small></span>
            </button>
            <button class="node-option" type="button" role="tab" data-device-id="desktop-5060-windows" aria-selected="false">
              <span id="node-desktop-5060-windows-dot" class="dot" data-state="loading"></span>
              <span><strong>Desktop 5060 Windows</strong><small>POWERSHELL / HOST</small></span>
            </button>
          </div>

          <div class="health-list">
            <article class="health-item">
              <span id="tailscale-dot" class="dot" data-state="loading"></span>
              <div><span class="label">TAILSCALE</span><strong id="tailscale-state">Checking...</strong></div>
            </article>
            <article class="health-item">
              <span id="device-dot" class="dot" data-state="loading"></span>
              <div><span id="selected-device-label" class="label">DK2500</span><strong id="device-state">Checking...</strong></div>
            </article>
          </div>

          <dl class="device-details">
            <div><dt>TAILSCALE IP</dt><dd id="ip-address">&mdash;</dd></div>
            <div><dt>HOSTNAME</dt><dd id="hostname">&mdash;</dd></div>
            <div><dt>ROLE / OS</dt><dd id="os">&mdash;</dd></div>
          </dl>

          <div class="action-stack">
            <label class="gui-toggle" title="Forward Linux GUI windows such as RViz, rqt, and turtlesim">
              <input id="gui-forwarding" type="checkbox" />
              <span class="toggle-track" aria-hidden="true"><span></span></span>
              <span><strong>GUI forwarding</strong><small>RVIZ / RQT / TURTLESIM</small></span>
            </label>
            <button id="connect" class="primary" type="button" title="Connect or disconnect (Ctrl+Shift+Enter)" disabled>
              <span class="connect-symbol" aria-hidden="true">&gt;_</span>
              <span class="connect-label">Connect</span>
            </button>
            <button id="open-vscode" class="vscode-action" type="button" title="Open selected node with VS Code Remote - SSH (Ctrl+Shift+O)" disabled>
              <span aria-hidden="true">&lt;/&gt;</span>
              <span>Open in VS Code</span>
            </button>
            <button id="open-visualization" class="visualize-action" type="button" title="Open ROS topics in Foxglove (Ctrl+Shift+G)" disabled>
              <span aria-hidden="true">◎</span>
              <span>Visualize ROS</span>
            </button>
          </div>
          <div class="status-line">
            <span id="status-message">Reading Tailscale status...</span>
            <span class="refresh-rate">AUTO REFRESH&nbsp; 4S</span>
          </div>
        </aside>
      </div>
    </main>
  </body>
</html>
