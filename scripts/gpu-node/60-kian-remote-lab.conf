# Managed by Kian Remote Lab. Installed as /etc/ssh/sshd_config.d/60-kian-remote-lab.conf.
Port 22
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
UsePAM yes
X11Forwarding no
AllowUsers kian
ClientAliveInterval 30
# Allow ten minutes of a temporarily unavailable client (Wi-Fi roaming,
# laptop standby, or a Tailscale path change) before cleaning up the session.
ClientAliveCountMax 20
